<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumshine</title>
<meta name="description" content="Sumshine, a number puzzle for Android: merge equal numbers to reach the target.">
<style>
  :root {
    --bg: #FDF4E3; --surface: #FFFFFF; --ink: #183153; --muted: #5F7491; --accent: #E5553A;
    --mango: #FFB627; --lemon: #FFD93D;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1B2D; --surface: #172840; --ink: #F6EFE2; --muted: #A3B4CB; --accent: #FF8A5C; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 560px; margin: 0 auto; padding: 64px 16px;
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center;
  }
  .sun { width: 120px; height: 120px; margin: 0 auto 8px; }
  h1 { font-size: 3rem; line-height: 1.1; margin: 0 0 8px; letter-spacing: -1px; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  nav { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  nav a {
    background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600;
    padding: 12px 20px; border-radius: 16px;
  }
</style>
</head>
<body>
<main>
  <!-- The sun made of tiles, as in the app icon. -->
  <svg class="sun" viewBox="-60 -60 120 120" aria-hidden="true">
    <g fill="var(--lemon)">
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(0)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(45)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(90)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(135)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(180)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(225)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(270)"/>
      <rect x="-7" y="-56" width="14" height="22" rx="7" transform="rotate(315)"/>
    </g>
    <rect x="-30" y="-30" width="60" height="60" rx="15" fill="var(--mango)"/>
    <path d="M-13 0h26M0 -13v26" stroke="#183153" stroke-width="8" stroke-linecap="round"/>
  </svg>
  <h1><span>Sum</span>shine</h1>
  <p>A number puzzle for Android: merge equal numbers to reach the target.</p>
  <p class="muted">Un puzle de números para Android: junta números iguales hasta llegar al objetivo.</p>
  <nav>
    <a href="privacy/">Privacy policy</a>
    <a href="privacy/es/">Política de privacidad</a>
    <a href="mailto:sumshine.game@gmail.com">Contact</a>
  </nav>
</main>
</body>
</html>
